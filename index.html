<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>経理ダッシュボード</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0f1117;
    --bg-card: #1a1d27;
    --bg-card-hover: #1f2333;
    --bg-input: #252836;
    --border: #2a2e3d;
    --border-focus: #6c63ff;
    --text: #e8e8ed;
    --text-muted: #8b8fa3;
    --text-dim: #5c607a;
    --accent: #6c63ff;
    --accent-glow: rgba(108, 99, 255, 0.15);
    --income: #34d399;
    --income-bg: rgba(52, 211, 153, 0.1);
    --expense: #f472b6;
    --expense-bg: rgba(244, 114, 182, 0.1);
    --balance: #60a5fa;
    --balance-bg: rgba(96, 165, 250, 0.1);
    --warn: #fbbf24;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ===== Login Screen ===== */
  .login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(108,99,255,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(52,211,153,0.05) 0%, transparent 50%),
      var(--bg);
  }

  .login-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: var(--shadow);
    text-align: center;
    animation: fadeUp 0.5s ease;
  }

  .login-box h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent), var(--income));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .login-box p {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 28px;
  }

  .login-input {
    width: 100%;
    padding: 14px 16px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 16px;
  }

  .login-input:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .login-btn {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
  }

  .login-btn:hover { background: #5a52e0; transform: translateY(-1px); }

  .login-error {
    color: var(--expense);
    font-size: 13px;
    margin-top: 12px;
    display: none;
  }

  /* ===== Main Dashboard ===== */
  .dashboard { display: none; }
  .dashboard.active { display: block; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    background: rgba(15,17,23,0.85);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .topbar-title {
    font-size: 18px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .topbar-title span {
    background: linear-gradient(135deg, var(--accent), var(--income));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .topbar-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .btn {
    padding: 8px 18px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text);
  }

  .btn:hover { background: var(--bg-card-hover); transform: translateY(-1px); }

  .btn-accent {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn-accent:hover { background: #5a52e0; }

  .btn-logout {
    background: transparent;
    border-color: var(--border);
    color: var(--text-muted);
    font-size: 12px;
  }

  .main-content {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px;
  }

  /* ===== Summary Cards ===== */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

  .summary-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.5s ease both;
  }

  .summary-card:nth-child(1) { animation-delay: 0.05s; }
  .summary-card:nth-child(2) { animation-delay: 0.1s; }
  .summary-card:nth-child(3) { animation-delay: 0.15s; }

  .summary-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }

  .summary-card.income::before { background: var(--income); }
  .summary-card.expense::before { background: var(--expense); }
  .summary-card.balance::before { background: var(--balance); }

  .card-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    margin-bottom: 14px;
  }

  .income .card-icon { background: var(--income-bg); }
  .expense .card-icon { background: var(--expense-bg); }
  .balance .card-icon { background: var(--balance-bg); }

  .card-label {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
    margin-bottom: 6px;
  }

  .card-value {
    font-size: 28px;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: -1px;
  }

  .income .card-value { color: var(--income); }
  .expense .card-value { color: var(--expense); }
  .balance .card-value { color: var(--balance); }

  /* ===== Charts ===== */
  .charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 28px;
  }

  .chart-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    animation: fadeUp 0.5s ease 0.2s both;
  }

  .chart-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 20px;
    color: var(--text);
  }

  .donut-container {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .donut-svg { flex-shrink: 0; }

  .donut-legend {
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 13px;
    flex: 1;
    min-width: 0;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .legend-label {
    color: var(--text-muted);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .legend-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
  }

  .bar-chart-area {
    height: 220px;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding-top: 10px;
  }

  .bar-group {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 0;
  }

  .bar-pair {
    display: flex;
    gap: 3px;
    align-items: flex-end;
    width: 100%;
    justify-content: center;
    height: 180px;
  }

  .bar {
    width: 16px;
    border-radius: 4px 4px 0 0;
    transition: height 0.6s ease;
    min-height: 2px;
  }

  .bar.income-bar { background: var(--income); opacity: 0.85; }
  .bar.expense-bar { background: var(--expense); opacity: 0.85; }

  .bar-label {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  /* ===== Sections: Form, Memo, Table ===== */
  .section-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 28px;
  }

  .section-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    animation: fadeUp 0.5s ease 0.3s both;
  }

  .section-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .form-group {
    margin-bottom: 14px;
  }

  .form-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 5px;
    display: block;
    font-weight: 500;
  }

  .form-input, .form-select {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  .form-input:focus, .form-select:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .memo-area {
    width: 100%;
    min-height: 200px;
    padding: 14px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    resize: vertical;
    line-height: 1.7;
    transition: border-color 0.2s;
  }

  .memo-area:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .memo-status {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 8px;
    text-align: right;
  }

  /* ===== Records Table ===== */
  .table-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 28px;
    animation: fadeUp 0.5s ease 0.35s both;
    overflow-x: auto;
  }

  .records-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .records-table th {
    text-align: left;
    padding: 10px 14px;
    color: var(--text-muted);
    font-weight: 500;
    font-size: 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .records-table td {
    padding: 10px 14px;
    border-bottom: 1px solid rgba(42,46,61,0.5);
    white-space: nowrap;
  }

  .records-table tr:hover td {
    background: rgba(108,99,255,0.03);
  }

  .type-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }

  .type-badge.income {
    background: var(--income-bg);
    color: var(--income);
  }

  .type-badge.expense {
    background: var(--expense-bg);
    color: var(--expense);
  }

  .amount-cell {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
  }

  .amount-cell.income { color: var(--income); }
  .amount-cell.expense { color: var(--expense); }

  .no-data {
    text-align: center;
    padding: 40px;
    color: var(--text-dim);
    font-size: 14px;
  }

  /* ===== Loading ===== */
  .loading-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15,17,23,0.7);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .loading-overlay.active {
    opacity: 1;
    pointer-events: all;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: 28px;
    right: 28px;
    padding: 14px 22px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    z-index: 1001;
    transform: translateY(20px);
    opacity: 0;
    transition: all 0.3s ease;
    box-shadow: var(--shadow);
  }

  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: var(--income); color: #fff; }
  .toast.error { background: var(--expense); color: #fff; }

  /* ===== Animations ===== */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ===== Responsive ===== */
  @media (max-width: 768px) {
    .summary-grid { grid-template-columns: 1fr; }
    .charts-grid { grid-template-columns: 1fr; }
    .section-grid { grid-template-columns: 1fr; }
    .main-content { padding: 16px; }
    .topbar { padding: 12px 16px; }
    .donut-container { flex-direction: column; }
    .card-value { font-size: 22px; }
    .bar { width: 10px; }
  }
</style>
</head>
<body>

<!-- ===== Login Screen ===== -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>📊 経理ダッシュボード</h1>
    <p>パスワードを入力してログイン</p>
    <input type="password" class="login-input" id="passwordInput" placeholder="パスワード" autocomplete="off">
    <button class="login-btn" id="loginBtn" onclick="handleLogin()">ログイン</button>
    <div class="login-error" id="loginError">パスワードが正しくありません</div>
  </div>
</div>

<!-- ===== Dashboard ===== -->
<div class="dashboard" id="dashboard">
  <div class="topbar">
    <div class="topbar-title">📊 <span>経理ダッシュボード</span></div>
    <div class="topbar-actions">
      <span id="lastUpdate" style="font-size:11px; color:var(--text-dim);"></span>
      <button class="btn btn-accent" onclick="refreshData()">🔄 更新</button>
      <button class="btn btn-logout" onclick="handleLogout()">ログアウト</button>
    </div>
  </div>

  <div class="main-content">
    <!-- Summary Cards -->
    <div class="summary-grid">
      <div class="summary-card income">
        <div class="card-icon">💰</div>
        <div class="card-label">今月の収入</div>
        <div class="card-value" id="totalIncome">¥0</div>
      </div>
      <div class="summary-card expense">
        <div class="card-icon">💸</div>
        <div class="card-label">今月の支出</div>
        <div class="card-value" id="totalExpense">¥0</div>
      </div>
      <div class="summary-card balance">
        <div class="card-icon">📈</div>
        <div class="card-label">今月の残高</div>
        <div class="card-value" id="totalBalance">¥0</div>
      </div>
    </div>

    <!-- Charts -->
    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-title">🍩 カテゴリ別支出</div>
        <div class="donut-container">
          <svg class="donut-svg" width="160" height="160" viewBox="0 0 160 160" id="donutChart"></svg>
          <div class="donut-legend" id="donutLegend"></div>
        </div>
      </div>
      <div class="chart-card">
        <div class="chart-title">📊 月別収支推移</div>
        <div class="bar-chart-area" id="barChart"></div>
      </div>
    </div>

    <!-- Form + Memo -->
    <div class="section-grid">
      <div class="section-card">
        <div class="section-title">✏️ 手動経費入力</div>
        <div class="form-group">
          <label class="form-label">日付</label>
          <input type="date" class="form-input" id="formDate">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">金額</label>
            <input type="number" class="form-input" id="formAmount" placeholder="1000">
          </div>
          <div class="form-group">
            <label class="form-label">カテゴリ</label>
            <select class="form-select" id="formCategory">
              <option value="飲食">飲食</option>
              <option value="交通費">交通費</option>
              <option value="消耗品">消耗品</option>
              <option value="交際費">交際費</option>
              <option value="広告費">広告費</option>
              <option value="外注費">外注費</option>
              <option value="家賃">家賃</option>
              <option value="光熱費">光熱費</option>
              <option value="通信費">通信費</option>
              <option value="雑費">雑費</option>
              <option value="売上">売上</option>
              <option value="収入">収入</option>
              <option value="報酬">報酬</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">説明</label>
          <input type="text" class="form-input" id="formDesc" placeholder="例: ランチ代、タクシー代">
        </div>
        <button class="btn btn-accent" style="width:100%; margin-top:6px;" onclick="submitManualEntry()">記帳する</button>
      </div>
      <div class="section-card">
        <div class="section-title">📝 メモ・ノート</div>
        <textarea class="memo-area" id="memoArea" placeholder="自由にメモを記入...&#10;（ブラウザに自動保存されます）"></textarea>
        <div class="memo-status" id="memoStatus">保存済み</div>
      </div>
    </div>

    <!-- Records Table -->
    <div class="table-card">
      <div class="section-title">📋 全明細一覧</div>
      <table class="records-table">
        <thead>
          <tr>
            <th>日付</th>
            <th>投稿者</th>
            <th>カテゴリ</th>
            <th>種別</th>
            <th>金額</th>
            <th>説明</th>
          </tr>
        </thead>
        <tbody id="recordsBody"></tbody>
      </table>
      <div class="no-data" id="noData" style="display:none;">データがありません。Discordから記帳するか、手動で入力してください。</div>
    </div>
  </div>
</div>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ========================================
// ★ 設定値（自分の情報に変更） ★
// ========================================
const PASSWORD = 'kaikei2026';  // ← 自分のパスワードに変更
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxw1kJNXHYTUzfqY5DxOhwrUy_4u5fWeiysaeurRz2O1RO5c1P6UXjDSYYrkQ5aagosgA/exec';              // ← GASデプロイURLを貼り付け

// 収入カテゴリ
const INCOME_CATEGORIES = ['売上', '収入', '入金', '報酬'];

// カテゴリカラー
const CATEGORY_COLORS = {
  '飲食': '#f472b6', '交通費': '#60a5fa', '消耗品': '#a78bfa',
  '交際費': '#fbbf24', '広告費': '#34d399', '外注費': '#f97316',
  '家賃': '#e879f9', '光熱費': '#22d3ee', '通信費': '#818cf8',
  '雑費': '#94a3b8', '売上': '#34d399', '収入': '#34d399', '報酬': '#34d399'
};

let allRecords = [];

function normalizeDate(d) {
  if (!d) return '';
  const s = String(d);
  if (s.includes('T')) {
    const dt = new Date(s);
    return dt.getFullYear() + '/' + String(dt.getMonth()+1).padStart(2,'0') + '/' + String(dt.getDate()).padStart(2,'0');
  }
  return s.replace(/-/g, '/');
}

// ========================================
// 認証
// ========================================
function handleLogin() {
  const pw = document.getElementById('passwordInput').value;
  if (pw === PASSWORD) {
    sessionStorage.setItem('kaikei_auth', 'true');
    showDashboard();
  } else {
    document.getElementById('loginError').style.display = 'block';
    document.getElementById('passwordInput').value = '';
    document.getElementById('passwordInput').focus();
  }
}

function handleLogout() {
  sessionStorage.removeItem('kaikei_auth');
  document.getElementById('dashboard').classList.remove('active');
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('passwordInput').value = '';
}

function showDashboard() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').classList.add('active');
  initDashboard();
}

// Enter キーでログイン
document.getElementById('passwordInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleLogin();
});

// セッション復帰
if (sessionStorage.getItem('kaikei_auth') === 'true') {
  showDashboard();
}

// ========================================
// データ取得
// ========================================
function showLoading(show) {
  document.getElementById('loading').classList.toggle('active', show);
}

function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast ' + type + ' show';
  setTimeout(() => toast.classList.remove('show'), 3000);
}

async function fetchData() {
  if (!GAS_URL) {
    // デモデータ（GAS URL未設定時）
    return generateDemoData();
  }
  showLoading(true);
  try {
    const res = await fetch(GAS_URL);
    const data = await res.json();
    return data.records || [];
  } catch (err) {
    showToast('データ取得に失敗しました', 'error');
    console.error(err);
    return [];
  } finally {
    showLoading(false);
  }
}

function generateDemoData() {
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();
  const cats = ['飲食','交通費','消耗品','交際費','光熱費','通信費','雑費'];
  const demos = [];
  // 過去6ヶ月分
  for (let mi = 0; mi < 6; mi++) {
    const month = new Date(y, m - mi, 1);
    const ym = month.getFullYear() + '/' + String(month.getMonth()+1).padStart(2,'0');
    // 収入
    demos.push({ date: ym+'/05', author:'Bot', category:'売上', type:'収入', amount: 300000 + Math.floor(Math.random()*200000), description:'月次売上' });
    demos.push({ date: ym+'/20', author:'Bot', category:'報酬', type:'収入', amount: 50000 + Math.floor(Math.random()*100000), description:'業務委託報酬' });
    // 支出
    for (let i = 0; i < 8; i++) {
      const cat = cats[Math.floor(Math.random()*cats.length)];
      demos.push({ date: ym+'/'+String(Math.floor(Math.random()*28)+1).padStart(2,'0'), author:'テスト', category: cat, type:'支出', amount: 500 + Math.floor(Math.random()*15000), description: cat+'の支払い' });
    }
  }
  return demos;
}

// ========================================
// ダッシュボード初期化
// ========================================
async function initDashboard() {
  // 日付フォームの初期値
  document.getElementById('formDate').valueAsDate = new Date();

  // メモ復元
  const saved = localStorage.getItem('kaikei_memo');
  if (saved) document.getElementById('memoArea').value = saved;

  // メモ自動保存
  let memoTimer;
  document.getElementById('memoArea').addEventListener('input', () => {
    document.getElementById('memoStatus').textContent = '保存中...';
    clearTimeout(memoTimer);
    memoTimer = setTimeout(() => {
      localStorage.setItem('kaikei_memo', document.getElementById('memoArea').value);
      document.getElementById('memoStatus').textContent = '✓ 自動保存済み';
    }, 500);
  });

  await refreshData();
}

async function refreshData() {
  allRecords = await fetchData();
  renderSummary();
  renderDonut();
  renderBarChart();
  renderTable();
  document.getElementById('lastUpdate').textContent =
    '更新: ' + new Date().toLocaleTimeString('ja-JP');
}

// ========================================
// サマリーカード
// ========================================
function renderSummary() {
  const now = new Date();
  const currentMonth = now.getFullYear() + '/' + String(now.getMonth()+1).padStart(2,'0');

  let income = 0, expense = 0;
  allRecords.forEach(r => {
    const rd = String(r.date);
    if (rd.startsWith(currentMonth)) {
      if (r.type === '収入' || INCOME_CATEGORIES.includes(r.category)) {
        income += Number(r.amount) || 0;
      } else {
        expense += Number(r.amount) || 0;
      }
    }
  });

  document.getElementById('totalIncome').textContent = '¥' + income.toLocaleString();
  document.getElementById('totalExpense').textContent = '¥' + expense.toLocaleString();
  document.getElementById('totalBalance').textContent = '¥' + (income - expense).toLocaleString();
}

// ========================================
// ドーナツチャート
// ========================================
function renderDonut() {
  const now = new Date();
  const currentMonth = now.getFullYear() + '/' + String(now.getMonth()+1).padStart(2,'0');

  const catTotals = {};
  allRecords.forEach(r => {
    const rd = String(r.date);
    if (rd.startsWith(currentMonth) && r.type !== '収入' && !INCOME_CATEGORIES.includes(r.category)) {
      catTotals[r.category] = (catTotals[r.category] || 0) + (Number(r.amount) || 0);
    }
  });

  const entries = Object.entries(catTotals).sort((a,b) => b[1] - a[1]);
  const total = entries.reduce((s, e) => s + e[1], 0);

  const svg = document.getElementById('donutChart');
  const legend = document.getElementById('donutLegend');
  svg.innerHTML = '';
  legend.innerHTML = '';

  if (entries.length === 0 || total === 0) {
    svg.innerHTML = `<circle cx="80" cy="80" r="55" fill="none" stroke="${getComputedStyle(document.documentElement).getPropertyValue('--border').trim()}" stroke-width="20"/>
      <text x="80" y="84" text-anchor="middle" fill="${getComputedStyle(document.documentElement).getPropertyValue('--text-dim').trim()}" font-size="13">データなし</text>`;
    return;
  }

  const cx = 80, cy = 80, r = 55;
  let startAngle = -90;

  entries.forEach(([cat, amount]) => {
    const pct = amount / total;
    const angle = pct * 360;
    const endAngle = startAngle + angle;

    const x1 = cx + r * Math.cos(startAngle * Math.PI / 180);
    const y1 = cy + r * Math.sin(startAngle * Math.PI / 180);
    const x2 = cx + r * Math.cos(endAngle * Math.PI / 180);
    const y2 = cy + r * Math.sin(endAngle * Math.PI / 180);
    const large = angle > 180 ? 1 : 0;

    const color = CATEGORY_COLORS[cat] || '#94a3b8';
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z`);
    path.setAttribute('fill', color);
    path.setAttribute('opacity', '0.85');
    path.style.transition = 'opacity 0.2s';
    path.addEventListener('mouseenter', () => path.setAttribute('opacity', '1'));
    path.addEventListener('mouseleave', () => path.setAttribute('opacity', '0.85'));
    svg.appendChild(path);

    startAngle = endAngle;

    // Legend
    legend.innerHTML += `<div class="legend-item">
      <div class="legend-dot" style="background:${color}"></div>
      <span class="legend-label">${cat}</span>
      <span class="legend-value">¥${amount.toLocaleString()}</span>
    </div>`;
  });

  // Center hole
  const hole = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  hole.setAttribute('cx', cx); hole.setAttribute('cy', cy);
  hole.setAttribute('r', 35); hole.setAttribute('fill', getComputedStyle(document.documentElement).getPropertyValue('--bg-card').trim());
  svg.appendChild(hole);

  const totalText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  totalText.setAttribute('x', cx); totalText.setAttribute('y', cy + 5);
  totalText.setAttribute('text-anchor', 'middle');
  totalText.setAttribute('fill', getComputedStyle(document.documentElement).getPropertyValue('--text').trim());
  totalText.setAttribute('font-size', '12');
  totalText.setAttribute('font-family', 'JetBrains Mono, monospace');
  totalText.textContent = '¥' + total.toLocaleString();
  svg.appendChild(totalText);
}

// ========================================
// 月別棒グラフ
// ========================================
function renderBarChart() {
  const monthly = {};
  allRecords.forEach(r => {
    const rd = String(r.date);
    const ym = rd.substring(0, 7);
    if (!monthly[ym]) monthly[ym] = { income: 0, expense: 0 };
    if (r.type === '収入' || INCOME_CATEGORIES.includes(r.category)) {
      monthly[ym].income += Number(r.amount) || 0;
    } else {
      monthly[ym].expense += Number(r.amount) || 0;
    }
  });

  const months = Object.keys(monthly).sort().slice(-6);
  const maxVal = Math.max(...months.map(m => Math.max(monthly[m].income, monthly[m].expense)), 1);

  const container = document.getElementById('barChart');
  container.innerHTML = '';

  if (months.length === 0) {
    container.innerHTML = '<div class="no-data">データがありません</div>';
    return;
  }

  months.forEach(m => {
    const d = monthly[m];
    const incH = (d.income / maxVal) * 170;
    const expH = (d.expense / maxVal) * 170;
    const label = m.split('/')[1] + '月';

    container.innerHTML += `<div class="bar-group">
      <div class="bar-pair">
        <div class="bar income-bar" style="height:${incH}px" title="収入: ¥${d.income.toLocaleString()}"></div>
        <div class="bar expense-bar" style="height:${expH}px" title="支出: ¥${d.expense.toLocaleString()}"></div>
      </div>
      <div class="bar-label">${label}</div>
    </div>`;
  });
}

// ========================================
// 明細テーブル
// ========================================
function renderTable() {
  const tbody = document.getElementById('recordsBody');
  const noData = document.getElementById('noData');

  if (allRecords.length === 0) {
    tbody.innerHTML = '';
    noData.style.display = 'block';
    return;
  }

  noData.style.display = 'none';

  // 新しい順にソート
  const sorted = [...allRecords].sort((a, b) => {
    return String(b.date).localeCompare(String(a.date));
  });

  tbody.innerHTML = sorted.map(r => {
    const isIncome = r.type === '収入' || INCOME_CATEGORIES.includes(r.category);
    const typeClass = isIncome ? 'income' : 'expense';
    const typeLabel = isIncome ? '収入' : '支出';
    const amount = Number(r.amount) || 0;
    return `<tr>
      <td>${escapeHtml(normalizeDate(r.date))}</td>
      <td>${escapeHtml(r.author || '')}</td>
      <td>${escapeHtml(r.category || '')}</td>
      <td><span class="type-badge ${typeClass}">${typeLabel}</span></td>
      <td class="amount-cell ${typeClass}">${isIncome ? '+' : '-'}¥${amount.toLocaleString()}</td>
      <td>${escapeHtml(r.description || '')}</td>
    </tr>`;
  }).join('');
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

// ========================================
// 手動入力
// ========================================
async function submitManualEntry() {
  const date = document.getElementById('formDate').value;
  const amount = document.getElementById('formAmount').value;
  const category = document.getElementById('formCategory').value;
  const desc = document.getElementById('formDesc').value;

  if (!date || !amount) {
    showToast('日付と金額は必須です', 'error');
    return;
  }

  const formattedDate = date.replace(/-/g, '/');
  const payload = {
    date: formattedDate,
    amount: Number(amount),
    category: category,
    description: desc,
    author: 'ダッシュボード',
    merchant: desc
  };

  if (!GAS_URL) {
    // デモモード: ローカルに追加
    const isIncome = INCOME_CATEGORIES.includes(category);
    allRecords.push({ ...payload, type: isIncome ? '収入' : '支出' });
    renderSummary(); renderDonut(); renderBarChart(); renderTable();
    showToast('✅ 記帳しました（デモモード）');
    document.getElementById('formAmount').value = '';
    document.getElementById('formDesc').value = '';
    return;
  }

  showLoading(true);
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      mode: 'no-cors'
    });
    showToast('✅ 記帳しました！');
    document.getElementById('formAmount').value = '';
    document.getElementById('formDesc').value = '';
    // 少し待ってからデータ再取得
    setTimeout(() => refreshData(), 1500);
  } catch (err) {
    showToast('送信に失敗しました', 'error');
    console.error(err);
  } finally {
    showLoading(false);
  }
}
</script>
